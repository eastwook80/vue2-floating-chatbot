<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 2.5.17 플로팅 챗봇 데모</title>
  <!-- Google Fonts: Inter & Pretendard/Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Vue 2.5.17 (로컬 node_modules 우선, 없을 시 CDN fallback) -->
  <script src="./node_modules/vue/dist/vue.js"></script>
  <script>
    if (typeof Vue === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/vue@2.5.17/dist/vue.js"><\/script>');
    }
  </script>

  <!-- http-vue-loader (Vue SFC 단독 .vue 파일 브라우저 직접 로더) -->
  <script src="./node_modules/http-vue-loader/src/httpVueLoader.js"></script>
  <script>
    if (typeof httpVueLoader === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/http-vue-loader@1.4.2/src/httpVueLoader.min.js"><\/script>');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .demo-page-container {
      text-align: center;
      padding: 40px 24px;
      max-width: 680px;
    }
    .demo-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #eef2ff;
      color: #4f46e5;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid #c7d2fe;
    }
    .demo-title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .demo-desc {
      font-size: 15px;
      color: #64748b;
      line-height: 1.65;
      margin-bottom: 28px;
    }
    .demo-features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      text-align: left;
      background: #ffffff;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: #334155;
    }
    .feature-icon {
      color: #4f46e5;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .demo-features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="demo-page-container">
      <div class="demo-badge">Vue 2.5.17 Standalone Component</div>
      <h1 class="demo-title">플로팅 챗봇 컴포넌트 데모</h1>
      <p class="demo-desc">
        우측 하단의 플로팅 버튼을 클릭하여 대화창을 열고 드래그 이동, 창 리사이즈, 대화 이력 관리, 첨부파일 대기 전송 및 클립보드 이미지 붙여넣기 기능을 테스트할 수 있습니다.
      </p>

      <div class="demo-features">
        <div class="feature-item"><span class="feature-icon">✓</span> 헤더 드래그 & 창 크기 리사이즈</div>
        <div class="feature-item"><span class="feature-icon">✓</span> 대화 이력 사이드바 & 전체/개별 삭제</div>
        <div class="feature-item"><span class="feature-icon">✓</span> 파일 첨부 목록 대기 & 동시 전송</div>
        <div class="feature-item"><span class="feature-icon">✓</span> 클립보드 이미지 바로 붙여넣기</div>
      </div>
    </div>

    <!-- FloatingChatbot.vue 단독 컴포넌트 마운트 -->
    <floating-chatbot></floating-chatbot>
  </div>

  <script>
    // httpVueLoader에서 export default 문법 자동 처리
    var origHttpRequest = httpVueLoader.httpRequest;
    httpVueLoader.httpRequest = function(url) {
      return origHttpRequest(url).then(function(content) {
        if (url.indexOf('.vue') !== -1) {
          return content.replace(/(<script[\s\S]*?>[\s\S]*?)export\s+default\s+/i, '$1module.exports = ');
        }
        return content;
      });
    };

    new Vue({
      el: '#app',
      components: {
        'floating-chatbot': httpVueLoader('./src/FloatingChatbot.vue')
      }
    });
  </script>
</body>
</html>
